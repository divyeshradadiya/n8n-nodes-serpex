name: CI and Publish
# Publishing runs on push to main via npm Trusted Publishing (OIDC); the connection must have
# "Allow npm publish" ticked on npmjs.com, otherwise the registry answers 403 (staging only).

permissions:
  contents: write      # required to push tags/commits
  packages: write      # optional: for package-related permissions
  id-token: write      # npm Trusted Publishing (OIDC) — NO registry-url on setup-node: it writes an .npmrc with an
# empty _authToken, npm then thinks it is authenticated and the OIDC exchange is denied (403): no NPM_TOKEN, nothing to expire

on:
  push:
    branches: [ main ]
    paths:
      - 'nodes/**'
      - 'credentials/**'
      - 'package.json'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'
    - name: Install dependencies
      run: npm ci
    - name: Run linter
      run: npm run lint
    - name: Build
      run: npm run build

  publish:
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
        fetch-depth: 0
        persist-credentials: true

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '24'

    - name: Install dependencies
      run: npm ci

    - name: Build
      run: npm run build

    - name: Bump version and push tag
      run: |
        git config --local user.email "action@github.com"
        git config --local user.name "GitHub Action"
        npm version patch --no-git-tag-version
        VER=$(node -p "require('./package.json').version")
        git add package.json
        git commit -m "chore: bump version to $VER"
        git tag "v$VER"
        git push origin HEAD:main
        git push origin "v$VER"

    - name: Publish to npm
      run: |
        npm install -g npm@11 # trusted publishing needs npm >= 11.5.1 (npm 12 needs node >= 22.22)
        npm publish --access public